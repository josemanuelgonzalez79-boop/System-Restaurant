<section class="auth-layout">
  <div class="brand-panel">
    <img src="essential-mark.png" alt="" />
    <span class="eyebrow">Primera configuración</span>
    <h1>Bienvenido a Essential.</h1>
    <p>
      Crea la cuenta propietaria. Desde ella podrás configurar el negocio y administrar a todo el
      equipo.
    </p>
  </div>

  <div class="auth-card setup-card">
    <div class="mobile-brand">
      <img src="essential-mark.png" alt="" />
      <strong>essential</strong>
    </div>
    <span class="eyebrow">Paso 1 de 1</span>
    <h2>Crear propietario</h2>
    <p>Esta cuenta tendrá el nivel de acceso más alto de la instalación.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        <span>Nombre completo</span>
        <input pInputText formControlName="fullName" autocomplete="name" />
        @if (form.controls.fullName.touched && form.controls.fullName.invalid) {
          <div class="field-errors" role="alert">
            @if (form.controls.fullName.hasError('required')) {
              <small>Escribe tu nombre completo.</small>
            } @else if (form.controls.fullName.hasError('minlength')) {
              <small>El nombre debe contener al menos 2 caracteres.</small>
            } @else if (form.controls.fullName.hasError('maxlength')) {
              <small>El nombre no puede superar 120 caracteres.</small>
            }
          </div>
        }
      </label>

      <label>
        <span>Usuario</span>
        <input pInputText formControlName="username" autocomplete="username" />
        <small class="field-help">Puede contener letras, números, punto, guion y guion bajo.</small>
        @if (form.controls.username.touched && form.controls.username.invalid) {
          <div class="field-errors" role="alert">
            @if (form.controls.username.hasError('required')) {
              <small>Escribe un nombre de usuario.</small>
            } @else if (form.controls.username.hasError('minlength')) {
              <small>El usuario debe contener al menos 4 caracteres.</small>
            } @else if (form.controls.username.hasError('maxlength')) {
              <small>El usuario no puede superar 80 caracteres.</small>
            } @else if (form.controls.username.hasError('pattern')) {
              <small>Usa solo letras, números, punto, guion o guion bajo.</small>
            }
          </div>
        }
      </label>

      <label>
        <span>Contraseña</span>
        <p-password
          formControlName="password"
          inputId="setup-password"
          autocomplete="new-password"
          promptLabel="Escribe una contraseña"
          weakLabel="Débil"
          mediumLabel="Media"
          strongLabel="Fuerte"
          [toggleMask]="true"
        />
        <small class="field-help">Usa al menos 10 caracteres, con letras y números.</small>
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <div class="field-errors" role="alert">
            @if (form.controls.password.hasError('required')) {
              <small>Escribe una contraseña.</small>
            } @else if (form.controls.password.hasError('minlength')) {
              <small>La contraseña debe contener al menos 10 caracteres.</small>
            } @else if (form.controls.password.hasError('maxlength')) {
              <small>La contraseña no puede superar 72 caracteres.</small>
            } @else if (form.controls.password.hasError('pattern')) {
              <small>La contraseña debe incluir al menos una letra y un número.</small>
            }
          </div>
        }
      </label>

      <label>
        <span>Confirmar contraseña</span>
        <p-password
          formControlName="confirmPassword"
          inputId="setup-confirm-password"
          autocomplete="new-password"
          [feedback]="false"
          [toggleMask]="true"
        />
        @if (form.controls.confirmPassword.touched) {
          <div class="field-errors" role="alert">
            @if (form.controls.confirmPassword.hasError('required')) {
              <small>Confirma la contraseña.</small>
            } @else if (form.hasError('passwordMismatch')) {
              <small>Las contraseñas no coinciden.</small>
            }
          </div>
        }
      </label>

      <p-button
        type="submit"
        label="Crear cuenta y continuar"
        icon="pi pi-check"
        [loading]="loading()"
      />
    </form>
  </div>
</section>
