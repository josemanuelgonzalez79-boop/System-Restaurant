<p-toast position="top-right" />

<header class="app-header">
  <p-toolbar>
    <ng-template #start>
      <a routerLink="/" class="brand" aria-label="Ir al inicio de Essential">
        <img class="brand-logo" src="essential-mark.png" alt="" />
        <span>
          <strong>essential</strong>
          <small>Control para tu negocio</small>
        </span>
      </a>
    </ng-template>

    <ng-template #end>
      @if (auth.authenticated()) {
        <nav aria-label="Navegación principal">
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
            Inicio
          </a>
          @if (auth.canAdminister()) {
            <a routerLink="/catalogo" routerLinkActive="active">Catálogo</a>
            <a routerLink="/estructura" routerLinkActive="active">Estructura</a>
          }
          @if (auth.isOwner()) {
            <a routerLink="/usuarios" routerLinkActive="active">Usuarios</a>
          }
          @if (auth.canAdminister()) {
            <a routerLink="/configuracion" routerLinkActive="active">Configuración</a>
          }
        </nav>
        <span class="current-user">{{ auth.user()?.fullName }}</span>
        <p-button
          icon="pi pi-sign-out"
          [rounded]="true"
          [text]="true"
          ariaLabel="Cerrar sesión"
          (onClick)="logout()"
        />
      }
      <p-button
        icon="pi pi-moon"
        [rounded]="true"
        [text]="true"
        ariaLabel="Alternar modo oscuro"
        (onClick)="toggleDarkMode()"
      />
    </ng-template>
  </p-toolbar>
</header>

<main class="app-content">
  <router-outlet />
</main>

<footer>Essential · control esencial para tu negocio</footer>
