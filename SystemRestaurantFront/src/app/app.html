<p-toast position="top-right" />

<header class="app-header">
  <p-toolbar>
    <ng-template #start>
      <a routerLink="/" class="brand" aria-label="Ir al inicio de RestaurantSystem">
        <span class="brand-mark"><i class="pi pi-shop"></i></span>
        <span>
          <strong>RestaurantSystem</strong>
          <small>Gestión de restaurantes</small>
        </span>
      </a>
    </ng-template>

    <ng-template #end>
      <nav aria-label="Navegación principal">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          Inicio
        </a>
        <a routerLink="/catalogo" routerLinkActive="active">Catálogo</a>
        <a routerLink="/configuracion" routerLinkActive="active">Configuración</a>
      </nav>
      <p-button
        icon="pi pi-moon"
        [rounded]="true"
        [text]="true"
        ariaLabel="Alternar modo oscuro"
        (onClick)="toggleDarkMode()"
      />
    </ng-template>
  </p-toolbar>
</header>

<main class="app-content">
  <router-outlet />
</main>

<footer>RestaurantSystem · operación local para restaurantes</footer>
