spring:
  application:
    name: Essential
  config:
    import: optional:file:./secret.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/restaurant_system}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:3210}
  shutdown: graceful
  compression:
    enabled: true
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax

app:
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://127.0.0.1:4200
